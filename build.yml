name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows x64 (assets not embedded)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: rustfmt, clippy

      - name: Install mingw
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --check

      # Lints are advisory here: the 1.2.0 codebase predates strict clippy and still has
      # a handful of style warnings, so this step must not fail the build.
      - name: Clippy (advisory)
        continue-on-error: true
        run: cargo clippy --all-targets --no-default-features

      # --no-default-features keeps Rovio's 1.2.0.ipa out of the binary and out of the repo.
      # The game then loads 1.2.0.ipa from its own folder at startup.
      - name: Build
        run: cargo build --release --no-default-features --target x86_64-pc-windows-gnu

      - name: Package
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-gnu/release/angry_birds_1_2.exe dist/AngryBirds_1.2.0.exe
          cp target/x86_64-pc-windows-gnu/release/uninstall.exe dist/
          cp INSTALL.bat README.txt dist/ 2>/dev/null || true
          cd dist && zip -r ../AngryBirds_1.2.0_Windows.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: AngryBirds-1.2.0-Windows
          path: AngryBirds_1.2.0_Windows.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AngryBirds_1.2.0_Windows.zip
          draft: true
          generate_release_notes: true
          body: |
            Windows x64 build, no game artwork embedded.

            **Setup:** unzip, then put your own `1.2.0.ipa` next to `AngryBirds_1.2.0.exe`
            (the release does not contain it — it is Rovio's copyrighted app).
            Level and physics data are already compiled into the exe.

            **Install:** run `INSTALL.bat` → copies to `%LOCALAPPDATA%\AngryBirds1_2`,
            adds Desktop / Start Menu shortcuts and an entry in *Settings → Apps*.

            **Uninstall:** `uninstall.exe`, or *Settings → Apps → Angry Birds 1.2.0*.
            Removes the install folder, save data, both registry keys and the shortcuts.
