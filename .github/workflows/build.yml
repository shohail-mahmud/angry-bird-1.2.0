name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows x64 single-file installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: rustfmt, clippy

      - name: Install mingw
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all --check

      # Lints are advisory here: the 1.2.0 codebase predates strict clippy and still has
      # a handful of style warnings, so this step must not fail the build.
      - name: Clippy (advisory)
        continue-on-error: true
        run: cargo clippy --all-targets --no-default-features

      # --no-default-features keeps Rovio's 1.2.0.ipa out of the binary, and the game then
      # loads 1.2.0.ipa from its own folder at startup.
      - name: Build game + uninstaller
        run: cargo build --release --no-default-features --target x86_64-pc-windows-gnu

      # The installer embeds both binaries, so they have to exist before it is compiled.
      # Output is one file: AngryBirds_1.2.0_Setup.exe — no zip anywhere.
      - name: Build single-file installer
        run: |
          mkdir -p installer/payload
          cp target/x86_64-pc-windows-gnu/release/angry_birds_1_2.exe installer/payload/game.exe
          cp target/x86_64-pc-windows-gnu/release/uninstall.exe   installer/payload/uninstall.exe
          cargo build --release --target x86_64-pc-windows-gnu -p angry_birds_setup
          cp target/x86_64-pc-windows-gnu/release/setup.exe AngryBirds_1.2.0_Setup.exe
          ls -l AngryBirds_1.2.0_Setup.exe

      - uses: actions/upload-artifact@v7
        with:
          name: AngryBirds-1.2.0-Setup
          path: AngryBirds_1.2.0_Setup.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: AngryBirds_1.2.0_Setup.exe
          draft: true
          generate_release_notes: true
          body: |
            # Download **`AngryBirds_1.2.0_Setup.exe`** and run it. One file, no zip.

            The installer carries the game and the uninstaller inside it. It copies them to
            `%LOCALAPPDATA%\AngryBirds1_2`, creates the Desktop and Start Menu shortcuts and
            registers the app in *Settings → Apps*, where it can also be uninstalled.

            **You also need `1.2.0.ipa`** — Rovio's app, which cannot be shipped here.
            Put it next to `AngryBirds_1.2.0_Setup.exe` before running, or pass its path when
            the installer asks. It gets copied into the install folder.

            Unsigned binary: SmartScreen may warn once → *More info → Run anyway*.
