name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Without this the job's GITHUB_TOKEN is read-only (GitHub's default for new repos) and
# creating the release fails with "Resource not accessible by integration".
permissions:
  contents: write

# Two pushes in a row used to race for the same release asset; the last one to finish won.
concurrency:
  group: angry-birds-120-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 installer (NSIS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: rustfmt, clippy

      - name: Install mingw
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all --check

      # Lints are advisory here: the 1.2.0 codebase predates strict clippy and still has
      # a handful of style warnings, so this step must not fail the build.
      - name: Clippy (advisory)
        continue-on-error: true
        run: cargo clippy --all-targets --no-default-features

      # --no-default-features keeps Rovio's 1.2.0.ipa out of the game binary; the installer
      # is what carries it, so players never have to supply anything.
      - name: Build game
        run: cargo build --release --no-default-features --target x86_64-pc-windows-gnu

      - name: Install NSIS
        run: sudo apt-get install -y nsis

      # Produces one graphical setup wizard, AngryBirds_1.2.0_Setup.exe: welcome page,
      # install folder, progress bar, Finish, and a real entry in Settings > Apps.
      # The game, the uninstaller and 1.2.0.ipa all come along inside it.
      - name: Build installer
        run: |
          mkdir -p installer/payload
          cp target/x86_64-pc-windows-gnu/release/angry_birds_1_2.exe installer/payload/game.exe
          cp 1.2.0.ipa installer/payload/1.2.0.ipa
          cp README.txt installer/payload/README.txt
          cd installer && makensis angry_birds.nsi
          cp AngryBirds_1.2.0_Setup.exe ../AngryBirds_1.2.0_Setup.exe
          ls -l ../AngryBirds_1.2.0_Setup.exe

      - uses: actions/upload-artifact@v7
        with:
          name: AngryBirds-1.2.0-Setup
          path: AngryBirds_1.2.0_Setup.exe

      # Publishing on push (not only on tags) is what puts a download button on the repo
      # page: the release, and its AngryBirds_1.2.0_Setup.exe asset, appear by themselves.
      # The tag is created automatically at the pushed commit if it does not exist yet.
      - name: Publish release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.2.0' }}
          name: Angry Birds 1.2.0 (Windows 64-bit)
          make_latest: true
          draft: false
          prerelease: false
          generate_release_notes: true
          # Exactly one asset: the self-contained installer. No zip, no bare game exe.
          files: AngryBirds_1.2.0_Setup.exe
          body: |
            ## Download `AngryBirds_1.2.0_Setup.exe` and run it

            One file, no zip. It installs the game, the uninstaller and the original
            `1.2.0.ipa` game data to `%LOCALAPPDATA%\AngryBirds1_2`, creates the Desktop and
            Start Menu shortcuts and registers the app in *Settings → Apps*, where it can also
            be uninstalled. Nothing else to download — install and play, fully offline.

            > Unsigned binary: Windows SmartScreen may warn once → *More info → Run anyway*.

            Original game © Rovio Entertainment. Unofficial fan rebuild of the engine in Rust;
            all artwork, audio, level design and trademarks belong to Rovio and are credited here.
