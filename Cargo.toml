[package]
name = "angry_birds_1_2"
version = "1.2.0"
edition = "2021"
description = "Native Rust rewrite of Angry Birds 1.2.0 (Feb 2010) for Windows"

[[bin]]
name = "angry_birds_1_2"
path = "src/main.rs"

[[bin]]
name = "uninstall"
path = "src/uninstall.rs"

[features]
# Embed the original 1.2.0.ipa into the executable. Off for public/CI builds, where the
# game loads 1.2.0.ipa from disk next to the exe instead (it contains Rovio's assets).
default = ["embed-assets"]
embed-assets = []

[dependencies]
macroquad = { version = "0.4", features = ["audio"] }
rapier2d = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
image = { version = "0.24", default-features = false, features = ["png"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "pcm"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
